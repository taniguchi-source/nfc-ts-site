<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>扇子 サンプル動画 | NFC-TS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../sample.css">
</head>
<body>

  <!-- ① 自社の動画ファイルを使う場合（推奨・余白なく全画面）
       この扇子フォルダ内に「video.mp4」を置くと再生されます。 -->
  <video id="v" class="fs-video" src="video.mp4" poster="poster.jpg"
         autoplay muted loop playsinline></video>

  <!-- ② YouTube/Vimeo を使う場合は、上の<video>を削除し、下のコメントを有効化してください
  <iframe class="fs-iframe"
          src="https://www.youtube.com/embed/XXXXXXXX?autoplay=1&mute=1&loop=1&playlist=XXXXXXXX&controls=0&playsinline=1"
          allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
  -->

  <div class="overlay">
    <div class="overlay__top">
      <span class="overlay__title">扇子 — ブランドストーリー</span>
      <a class="btn-back" href="../index.html">← 一覧</a>
    </div>
    <button class="btn-sound" id="sound" type="button">🔇 音声をオンにする</button>
  </div>

  <script>
    var v = document.getElementById('v');
    var b = document.getElementById('sound');
    if (b && v) {
      b.addEventListener('click', function () {
        v.muted = !v.muted;
        b.textContent = v.muted ? '🔇 音声をオンにする' : '🔊 音声をオフにする';
        v.play();
      });
    }
  </script>
</body>
</html>
