<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>御朱印帳 サンプル動画 | NFC-TS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../sample.css">
</head>
<body>

  <!-- Vimeo動画を全画面（cover）で自動再生（ミュート・ループ）
       元リンク: https://vimeo.com/1199252175/af8726be0e -->
  <div class="fs-cover">
    <iframe id="v"
            src="https://player.vimeo.com/video/1199252175?h=af8726be0e&background=1&autoplay=1&loop=1&muted=1&playsinline=1"
            allow="autoplay; fullscreen; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin"
            title="御朱印帳 サンプル動画"></iframe>
  </div>

  <div class="overlay">
    <div class="overlay__top">
      <span class="overlay__title">御朱印帳 — サンプル動画</span>
      <a class="btn-back" href="../index.html">← 一覧</a>
    </div>
    <button class="btn-sound" id="sound" type="button">🔇 音声をオンにする</button>
  </div>

  <script src="https://player.vimeo.com/api/player.js"></script>
  <script>
    var b = document.getElementById('sound');
    var player = new Vimeo.Player(document.getElementById('v'));
    var muted = true;
    b.addEventListener('click', function () {
      muted = !muted;
      player.setMuted(muted).then(function () {
        if (!muted) { player.setVolume(1); player.play(); }
      });
      b.textContent = muted ? '🔇 音声をオンにする' : '🔊 音声をオフにする';
    });
  </script>
</body>
</html>
